name: Docs CI

on:
  pull_request:
  push:
    branches-ignore:
      - main # main 分支由 deploy.yml 负责构建并发布

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: npm run lint:md

      - name: Check formatting
        run: npm run format:check

      - name: Build docs (internal dead-link check)
        run: npm run docs:build
