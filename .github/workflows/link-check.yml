name: Link Check

# 外链检查较慢且易受网络波动影响，独立于 PR 流水线：
# 每周定时跑一次，并支持手动触发。
on:
  schedule:
    - cron: '0 1 * * 1' # 每周一 09:00 (Asia/Shanghai, UTC+8)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  links:
    name: Check external links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,206,429
            'docs/**/*.md'
          fail: false

      - name: Create issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Link Check: 发现失效链接'
          content-filepath: ./lychee/out.md
          labels: documentation, link-check
